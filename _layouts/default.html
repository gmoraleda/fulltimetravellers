<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title }}">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="header-inner">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav>
          <a href="{{ '/es/' | relative_url }}">Español</a>
          <a href="{{ '/de/' | relative_url }}">Deutsch</a>
        </nav>
      </div>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      <p>Archive of <a href="http://fulltimetravellers.net">fulltimetravellers.net</a></p>
    </footer>
  </div>
</body>
</html>
